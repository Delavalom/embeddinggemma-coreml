# Every threshold lives here. Changing this file needs a new docs/decisions/ADR-*.md in the same commit.
#
# Each table is keyed by the full stage name. The comparison direction comes from the key:
#   min_*  -> metric >= value
#   max_*  -> metric <= value
#   bool   -> metric == value
# Any other key raises when the file is loaded. The prefix is the direction only; each metric's
# docstring (egcm/metrics.py) or stage README defines how it is aggregated.
# A "targets" subtable holds recorded-only numbers; it is never gated.

[s0_reference]
license_apache = true
key_inventory_written = true
deterministic = true

[s1_rewrite]
strict_load = true
min_cosine_text = 0.9999
min_cosine_image = 0.9999

[s2_coreml_fp32]
min_cosine_text = 0.9999
min_cosine_image = 0.9999

[s3_coreml_ane]
# ADR-0006: images on the Neural Engine. The image minimum is a floor; the 0.995 bar holds for the 1st percentile
# (linear interpolation over all 400 image vectors), and the task-level effect is gated against the bucketed FP
# reference (s0 emb_bucket), as in s4.
min_cosine_text = 0.995
min_cosine_image = 0.99
min_p1_cosine_image = 0.995
min_recall_at_10 = 0.95
# 5th percentile over the 120 app queries (see egcm.metrics.spearman_topk).
min_p5_spearman_top50 = 0.9
min_ane_fraction = 0.95

[s4_compress]
# ADR-0007. min_cosine is the minimum over text and image vectors combined. The two ranking gates are against the
# bucketed FP reference (s0 emb_bucket); the worst of budgets 70 and 280.
min_cosine = 0.99
min_recall_at_10 = 0.95
# 5th percentile over the 120 app queries (see egcm.metrics.spearman_topk).
min_p5_spearman_top50 = 0.9
# Bucketing fidelity against s0's exact-aspect vectors (emb_raw), worst budget (egcm.ranking): the exact-aspect top-1
# image is in the package's top 10; image->image category precision@10 drops by at most 0.03.
min_t2i_top1_in_top10 = 0.95
max_i2i_label_p10_drop = 0.03
# The device download: one Apple Archive (LZFSE) of the package and the tokenizer, egcm.archive (ADR-0007: raised
# from 300, founder approved 2026-10-25).
max_download_mb = 360

[s4_compress.targets]
# Recorded only: text->image recall@10 against exact-aspect (fixed buckets cannot reach it; ADR-0007).
t2i_recall_at_10_exact_aspect = 0.95

[s5_swift]
# ADR-0008 (accepted 2026-10-25): one reference per question. Token ids and pixels (PNG + synthetic, ADR-0004) against
# s0 as before. The cosine against s0 includes the JPEG decoder (ImageIO vs PIL) and is recorded only.
token_ids_identical = true
# 1/255 rounded up.
max_pixel_abs_diff = 0.003922
# Swift vs Python Core ML (the same s4 package, the same compute units) on Swift's exact inputs: its token ids and its
# bucket images. Minimum over every text and image vector.
min_cosine_runtime = 0.9999
# s4's task-level gates, thresholds unchanged, on the Swift vectors against the FP reference on Swift's pixels (s0
# emb_bucket where the bucket image is byte-identical to s0's, else the FP32 rewrite; texts: s0 emb). min_cosine is
# over text and image vectors combined; ranking and bucketing are the worst of budgets 70 and 280, as in s4.
min_cosine = 0.99
min_recall_at_10 = 0.95
# 5th percentile over the 120 app queries (see egcm.metrics.spearman_topk).
min_p5_spearman_top50 = 0.9
min_t2i_top1_in_top10 = 0.95
max_i2i_label_p10_drop = 0.03

[s6_device]
max_peak_rss_mb = 800
min_devices = 1

[s6_device.targets]
target_ms_per_image_70 = 60

[s7_publish]
confirmed = true
