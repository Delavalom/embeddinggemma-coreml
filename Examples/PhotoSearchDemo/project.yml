# XcodeGen spec. `xcodegen generate` (or `mise exec -- xcodegen generate`) writes PhotoSearchDemo.xcodeproj
# (gitignored). See README.md: the model is bundled from ./Model, which `just stage 6` writes.
name: PhotoSearchDemo
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
packages:
  EmbeddingGemma:
    path: ../../swift
targets:
  PhotoSearchDemo:
    type: application
    platform: iOS
    sources:
      - path: Sources
    # The published model folder that `just stage 6` writes to ./Model: one layout per image budget in Model/b70/ and
    # Model/b280/ (each files.json, EmbeddingGemma2.mlpackage/, tokenizer/; ADR-0010), or one 14-function layout in
    # Model/ itself. Copied verbatim, subfolders included, into the bundle as `Model/`. Optional: without it the app
    # uses the Hugging Face default model. A script rather than a folder reference, so the project builds when
    # ./Model does not exist.
    postCompileScripts:
      - name: Bundle the local model
        basedOnDependencyAnalysis: false
        script: |
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Model"
          if [ -f "$SRCROOT/Model/files.json" ] || [ -f "$SRCROOT/Model/b70/files.json" ] \
             || [ -f "$SRCROOT/Model/b280/files.json" ]; then
            mkdir -p "$dest" && rsync -a --delete "$SRCROOT/Model/" "$dest/"
          else
            rm -rf "$dest"
          fi
    dependencies:
      - package: EmbeddingGemma
        products: [EmbeddingGemma, EmbeddingIndex]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.delavalom.egcm.demo
        PRODUCT_NAME: PhotoSearchDemo
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO  # the model script reads ./Model
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Photo Search
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Search your photos on-device.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
