name: Probe
options:
  deploymentTarget:
    iOS: "18.0"
configFiles:
  Debug: Base.xcconfig
  Release: Base.xcconfig
targets:
  Probe:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Folder reference: the .mlpackage folders are copied as they are (not compiled by Xcode); the probe
      # compiles them on the device. Built by build-models.sh (gitignored).
      - path: ProbeModels
        type: folder
        buildPhase: resources
    # E1g (`-from group`) needs the App Group group.com.delavalom.egcm.demo registered for this bundle id, which only
    # the Developer Portal web session can do; then add `entitlements: {path: Probe.entitlements, properties:
    # {com.apple.security.application-groups: [group.com.delavalom.egcm.demo]}}` here.
    settings:
      base:
        CURRENT_PROJECT_VERSION: "1"  # override on the xcodebuild command line to build an "update"
        PRODUCT_BUNDLE_IDENTIFIER: com.delavalom.egcm.demo
        PRODUCT_NAME: PhotoSearchDemo
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
